<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/checkout.js"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider checkout">
      <h1>Checkout</h1>

      <section class="checkout-grid">
       
        <form class="checkout-form" id="checkout-form">
          <fieldset>
            <legend>Customer</legend>

            <label>
              First Name
              <input name="fname" required />
            </label>

            <label>
              Last Name
              <input name="lname" required />
            </label>
          </fieldset>

          <fieldset>
            <legend>Address</legend>

            <label>
              Street Address
              <input name="street" required />
            </label>

            <label>
              City
              <input name="city" required />
            </label>

            <label>
              State
              <input name="state" required />
            </label>

            <label>
              Zip Code
              <input name="zip" required />
            </label>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>

            <label>
              Credit Card Number
              <input name="cardNumber" required />
            </label>

            <label>
              Expiration Date
              <input name="expiration" required placeholder="8/29" />
            </label>

            <label>
              Security Code
              <input name="code" required />
            </label>
          </fieldset>

          <button type="submit">Checkout</button>
        </form>

        <!-- ORDER SUMMARY -->
        <aside class="order-summary">
          <h2>Order Summary</h2>
          <p>Subtotal: <span id="summary-subtotal">$0.00</span></p>
          <p>Tax (6%): <span id="summary-tax">$0.00</span></p>
          <p>Shipping: <span id="summary-shipping">$0.00</span></p>
          <p><strong>Order Total: <span id="summary-total">$0.00</span></strong></p>

          <p id="checkout-message"></p>
        </aside>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
